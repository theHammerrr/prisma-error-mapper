services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prisma_error_mapper_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d prisma_error_mapper_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
